          restore-keys: gradle-

      - name: Run CxGo integration tests
        run: |
          ./gradlew clean CxGoIntegrationTest --info \
            -Dtarget=${{ env.HOOK_TARGET }} \
            -Drepo=${{ secrets.HOOK_REPO }} \
