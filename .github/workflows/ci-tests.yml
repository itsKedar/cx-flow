      - name: Run PR comments integration tests
        run: |
          ./gradlew clean PullRequestCommnetsIntegrationTest --info \
            -Dtarget=${{ env.HOOK_TARGET }} \
            -Drepo=${{ secrets.HOOK_REPO }} \
            -Dnamespace=${{ secrets.HOOK_NAMESPACE }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-pr-comments-integration
          path: '**/build/test-results/**/*.xml'
          if-no-files-found: ignore
          retention-days: 7

  sast-cli-integration-tests:
    name: SAST CLI Integration Tests
    runs-on: ubuntu-latest
    needs: [deploy-eks]
    if: needs.deploy-eks.result == 'success' && !inputs.skip_sast_cli
    env:
      HOOK_TARGET: https://${{ needs.deploy-eks.outputs.release_name }}.${{ secrets.EXTERNAL_DNS_DOMAIN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'build.gradle') }}
          restore-keys: gradle-

      - name: Import SSL certificate
        run: |
          sudo keytool -import -alias sastcer -storepass changeit \
            -keystore "$JAVA_HOME/lib/security/cacerts" \
            -file src/test/resources/checkmarx.crt --noprompt

      - name: Run SAST CLI integration tests
        run: |
          ./gradlew clean SastCliIntegrationTest --info \
            -Dtarget=${{ env.HOOK_TARGET }} \
            -Drepo=${{ secrets.HOOK_REPO }} \
            -Dnamespace=${{ secrets.HOOK_NAMESPACE }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-sast-cli-integration
          path: '**/build/test-results/**/*.xml'
          if-no-files-found: ignore
          retention-days: 7

