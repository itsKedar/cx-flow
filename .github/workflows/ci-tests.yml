name: CI Tests

on:
  push:
    branches:
      - master
      - develop
      - 'pr-*'
  pull_request:
  workflow_dispatch:
    inputs:
      tests_to_run:
        description: 'Scope of tests to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - component-test
          - integration-test
      skip_integration:
        description: 'Skip GitHub/Azure integration tests'
        required: false
        default: false
        type: boolean
      skip_sca_integration:
        description: 'Skip SCA integration tests'
        required: false
        default: false
        type: boolean
      skip_jira_integration:
        description: 'Skip Jira integration tests'
        required: false
        default: false
        type: boolean
      skip_pr_comments:
        description: 'Skip PR comments integration tests'
        required: false
        default: false
        type: boolean
      skip_sast_cli:
        description: 'Skip SAST CLI integration tests'
        required: false
        default: false
        type: boolean
      skip_sca_cli:
        description: 'Skip SCA CLI integration tests'
        required: false
        default: false
        type: boolean
      skip_cxgo:
        description: 'Skip CxGo integration tests'
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      tests_to_run:
        description: 'Scope of tests to run (all | component-test | integration-test)'
        required: false
        default: 'all'
        type: string
      skip_integration:
        required: false
        default: false
        type: boolean
      skip_sca_integration:
        required: false
        default: false
        type: boolean
      skip_jira_integration:
        required: false
        default: false
        type: boolean
      skip_pr_comments:
        required: false
        default: false
        type: boolean
      skip_sast_cli:
        required: false
        default: false
        type: boolean
      skip_sca_cli:
        required: false
        default: false
        type: boolean
      skip_cxgo:
        required: false
        default: false
        type: boolean

env:
  JAVA_OPTS: -Xmx3200m

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'build.gradle') }}
          restore-keys: gradle-

      - name: Build and test
        run: ./gradlew clean build

      - name: Assemble fat JAR
        run: ./gradlew -b build.gradle --build-cache assemble

      - name: Get version from version.txt
        id: version
        run: |
          VERSION=$(cat version.txt | tr -d '[:space:]')
          cp version.txt build/libs/version.txt
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-libs
          path: build/libs/
          retention-days: 1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-build
          path: '**/build/test-results/**/*.xml'
          if-no-files-found: ignore
          retention-days: 7

