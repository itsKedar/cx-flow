  pr-comments-integration-tests:
    name: PR Comments Integration Tests
    runs-on: ubuntu-latest
    needs: [deploy-eks]
    if: needs.deploy-eks.result == 'success' && !inputs.skip_pr_comments
    env:
      HOOK_TARGET: https://${{ needs.deploy-eks.outputs.release_name }}.${{ secrets.EXTERNAL_DNS_DOMAIN }}
