      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-cxgo-integration
          path: '**/build/test-results/**/*.xml'
          if-no-files-found: ignore
          retention-days: 7

