  cleanup-eks:
    name: Cleanup EKS
    runs-on: ubuntu-latest
    needs:
      - deploy-eks
      - integration-tests
      - sca-integration-tests
      - jira-integration-tests
      - pr-comments-integration-tests
      - sast-cli-integration-tests
      - sca-cli-integration-tests
      - cxgo-integration-tests
    # Always clean up if EKS was deployed, regardless of test outcomes or skips
    if: always() && needs.deploy-eks.result == 'success'
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 # v4.1.0
        with:
          role-to-assume: arn:aws:iam::983555762431:role/cx-flow-ci-circleci
          aws-region: eu-west-1

      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4.0.1
        with:
          version: 'v1.23.6'

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name eks-cxflow-ci --region eu-west-1

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: 'v3.9.0'

      - name: Uninstall Helm release
        run: |
          helm uninstall ${{ needs.deploy-eks.outputs.release_name }} \
            --namespace ${{ needs.deploy-eks.outputs.namespace }} || true

      - name: Delete namespace
        run: |
          kubectl delete namespace ${{ needs.deploy-eks.outputs.namespace }} || true
