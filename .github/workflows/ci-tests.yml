      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-sca-cli-integration
          path: '**/build/test-results/**/*.xml'
          if-no-files-found: ignore
          retention-days: 7

  cxgo-integration-tests:
    name: CxGo Integration Tests
    runs-on: ubuntu-latest
    needs: [deploy-eks]
    if: needs.deploy-eks.result == 'success' && !inputs.skip_cxgo
    env:
      HOOK_TARGET: https://${{ needs.deploy-eks.outputs.release_name }}.${{ secrets.EXTERNAL_DNS_DOMAIN }}
    steps:
